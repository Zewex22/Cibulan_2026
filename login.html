<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 300px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
        }

        .form-group input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>Halaman Login</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" autocomplete="off">
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password">
            </div>
            <button type="submit">Login</button>
        </form>
    </div>

    <script>
        const USERNAME_BENAR = "admin";
        const PASSWORD_BENAR = "12345";

        const loginForm = document.getElementById('loginForm');

        loginForm.addEventListener('submit', function (e) {
            e.preventDefault();

            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value.trim();

            // 1. Validasi Input Tidak Boleh Kosong
            if (usernameInput === "" || passwordInput === "") {
                alert("Gagal: Username dan Password tidak boleh kosong!");
                return;
            }

            // 2. Validasi Username dan Password
            if (usernameInput === USERNAME_BENAR && passwordInput === PASSWORD_BENAR) {
                alert("Login Berhasil! Mengalihkan ke halaman utama...");

                // Berpindah ke halaman index.html
                window.location.href = "index.html";
            } else {
                alert("Login Gagal: Username atau Password salah!");

                // Reset form dan tetap di halaman login
                loginForm.reset();
                document.getElementById('username').focus();
            }
        });
    </script>
</body>

</html>
